<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BXG 데이터 분석 대시보드</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts - Inter & Pretendard for Korean -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Modern Dashboard Styles -->
    <!-- <link href="{{ url_for('static', path='/css/variables.css') }}" rel="stylesheet"> -->
    <!-- <link href="{{ url_for('static', path='/css/dashboard-modern.css') }}" rel="stylesheet"> -->

    <!-- Base Layout CSS -->
    <link href="base-layout.css" rel="stylesheet">

    <!-- Base Dashboard CSS -->
    <link href="base-dashboard.css" rel="stylesheet">

    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-3.1.0.min.js" charset="utf-8"></script>
    
    <!-- Crossfilter.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crossfilter2/1.5.4/crossfilter.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-bar-chart"></i> BXG 분석 대시보드
            </span>
        </div>
    </nav>

    <main class="container-fluid mt-3">
        <div class="row">
          <!-- 제목 및 설명 -->
          <div class="col-12">
            <h2>BXG 데이터 분석 대시보드</h2>
            <p class="text-muted">대시보드를 통해 데이터를 분석하세요</p>
            <hr />
          </div>
        </div>

        <div class="row">
          <!-- 필터 패널 -->
          <div
            class="col-md-3"
            style="flex: 0 0 20%; max-width: 20%"
          >
            <div class="filter-panel">
              <h5><i class="bi bi-funnel"></i> 필터</h5>

              <!-- Date Range Filter Example -->
              <div class="filter-group">
                <label class="form-label">날짜 범위 필터</label>
                <div class="row">
                  <div class="col-6">
                    <input
                      type="date"
                      class="form-control form-control-sm"
                      id="filter_date_start"
                      data-column="date"
                      data-type="date_start"
                    />
                  </div>
                  <div class="col-6">
                    <input
                      type="date"
                      class="form-control form-control-sm"
                      id="filter_date_end"
                      data-column="date"
                      data-type="date_end"
                    />
                  </div>
                </div>
              </div>

              <!-- Range Filter Example -->
              <div class="filter-group">
                <label class="form-label">범위 필터</label>
                <input
                  type="range"
                  class="form-range"
                  id="filter_range"
                  data-column="range"
                  data-type="range"
                  min="0"
                  max="100"
                />
                <div class="d-flex justify-content-between">
                  <small class="text-muted">0</small>
                  <small class="text-muted">100</small>
                </div>
              </div>

              <!-- Multi Select Filter Example -->
              <div class="filter-group">
                <label class="form-label">다중 선택 필터</label>
                <select
                  class="form-select form-select-sm"
                  multiple
                  id="filter_multi"
                  data-column="multi"
                  data-type="multi_select"
                >
                  <option value="option1">옵션 1</option>
                  <option value="option2">옵션 2</option>
                  <option value="option3">옵션 3</option>
                </select>
              </div>

              <!-- Single Select Filter Example -->
              <div class="filter-group">
                <label class="form-label">단일 선택 필터</label>
                <select
                  class="form-select form-select-sm"
                  id="filter_single"
                  data-column="single"
                  data-type="select"
                >
                  <option value="">전체</option>
                  <option value="option1">옵션 1</option>
                  <option value="option2">옵션 2</option>
                </select>
              </div>

              <button
                type="button"
                class="btn btn-secondary btn-sm w-100"
                onclick="resetFilters()"
              >
                <i class="bi bi-arrow-clockwise"></i> 필터 초기화
              </button>
            </div>

            <!-- 통계 패널 -->
            <div class="stats-panel">
              <h6><i class="bi bi-graph-up"></i> 통계 정보</h6>
              <div id="stats-content">
                <div>총 데이터: <span id="total-count">0</span>행</div>
                <div>
                  필터링된 데이터: <span id="filtered-count">0</span>행
                </div>
              </div>
            </div>
          </div>

          <!-- 차트 영역 -->
          <div
            class="col-md-9"
            style="flex: 0 0 80%; max-width: 80%"
          >
            <!-- 다중 차트 레이아웃 -->
            <div class="multi-chart-container" data-chart-count="1" style="display: none;">
              <div class="chart-container chart-item" data-chart-index="0">
                <div class="chart-header">
                  <h6>Chart 1</h6>
                </div>
                <div
                  class="loading chart-loading"
                  id="loading-0"
                  style="display: none"
                >
                  <div
                    class="spinner-border text-primary"
                    role="status"
                  >
                    <span class="visually-hidden">차트 1 로딩 중...</span>
                  </div>
                  <p>차트 1 로딩 중...</p>
                </div>
                <div id="chart-0" class="chart-plot"></div>
              </div>
              <div class="chart-container chart-item" data-chart-index="1">
                <div class="chart-header">
                  <h6>Chart 2</h6>
                </div>
                <div
                  class="loading chart-loading"
                  id="loading-1"
                  style="display: none"
                >
                  <div
                    class="spinner-border text-primary"
                    role="status"
                  >
                    <span class="visually-hidden">차트 2 로딩 중...</span>
                  </div>
                  <p>차트 2 로딩 중...</p>
                </div>
                <div id="chart-1" class="chart-plot"></div>
              </div>
              <div class="chart-container chart-item" data-chart-index="2">
                <div class="chart-header">
                  <h6>Chart 3</h6>
                </div>
                <div
                  class="loading chart-loading"
                  id="loading-2"
                  style="display: none"
                >
                  <div
                    class="spinner-border text-primary"
                    role="status"
                  >
                    <span class="visually-hidden">차트 3 로딩 중...</span>
                  </div>
                  <p>차트 3 로딩 중...</p>
                </div>
                <div id="chart-2" class="chart-plot"></div>
              </div>
            </div>

            <!-- 기존 단일 차트 레이아웃 -->
            <div class="chart-container">
              <div
                class="loading"
                id="loading"
              >
                <div
                  class="spinner-border text-primary"
                  role="status"
                >
                  <span class="visually-hidden">로딩 중...</span>
                </div>
                <p>데이터를 불러오는 중입니다...</p>
              </div>
              <div id="chart"></div>
            </div>
          </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Base Dashboard JavaScript -->
    <script src="base-dashboard.js"></script>
</body>
</html>
